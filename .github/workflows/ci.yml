name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Service container: a throwaway real Postgres, matching production, instead of mocks.
    # Credentials match the defaults in app/core/config.py, so no DATABASE_URL override is needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: howispend
          POSTGRES_PASSWORD: howispend
          POSTGRES_DB: howispend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howispend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      # Drift check: fails the build if models changed without a matching migration.
      - run: uv run alembic check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
