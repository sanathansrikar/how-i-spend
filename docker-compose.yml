# Local development database. Apps run natively (uv / npm) for fast reload.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: howispend
      POSTGRES_PASSWORD: howispend
      POSTGRES_DB: howispend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U howispend"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
